[tool.poetry]
name = "backend"
version = "0.2.0"
description = ""
authors = ["grupo-193"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.3"
sqlalchemy = "^2.0.49"
argon2-cffi = "^25.1.0"
python-jose = "^3.5.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.13.1"
uvicorn = "^0.44.0"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
greenlet = "^3.5.0"
aiosmtplib = "^5.1.2"
openpyxl = "^3.1.5"
tzdata = "^2026.3"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp-proto-http = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
structlog = "^26.1.0"
opentelemetry-instrumentation-logging = "^0.65b0"
python-multipart = "^0.0.32"
aioboto3 = "^15.5.0"
google-genai = "^2.23.0"
httpx = "^0.28.1"
google-auth = {extras = ["requests"], version = "^2.0"}
apscheduler = "^3.11.0"
tenacity = "^9.1.4"
redis = "^8.1.0"
limits = "^5.8.0"
pulp = "^3.3"
highspy = "^1.15"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.8,<0.16.0"
pre-commit = ">=4.5.1,<5.0.0"
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
testcontainers = {extras = ["postgres", "redis"], version = "^4.14.2"}
psycopg2-binary = "^2.9.12"
pytest-asyncio = "^1.3.0"
openpyxl = "^3.1.5"
moto = {extras = ["s3"], version = "^5.2.3"}
flask = "^3.1.3"
flask-cors = "^6.0.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
omit = [
    "alembic/*",
    "alembic/versions/*",
]
