name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python-env

      - name: Run unit tests
        run: poetry run pytest tests/unit --cov --cov-report=xml --durations=25
        env:
          COVERAGE_CORE: sysmon

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 #v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        run: poetry run pytest tests/integration --cov --cov-report=xml --durations=25
        env:
          COVERAGE_CORE: sysmon

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 #v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config p/python --config p/secrets --error

  docker-build:
    runs-on: ubuntu-latest
    # The image is published from this job, so it waits for everything that can fail.
    needs: [lint, unit-tests, integration-tests, semgrep]
    # Two pushes to develop or main must not race to move the branch's tag, so their
    # runs publish in turn. Any other branch gets a group of its own and never waits.
    concurrency:
      group: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && format('publish-{0}', github.ref) || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 #v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 #v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the backend with its dependencies
        # The compose is what the E2E runs use: it prepares the database, loads the
        # reference data and waits until the backend answers /ready.
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: docker compose -f e2e/compose.yml up --wait

      - name: Show the logs
        if: failure()
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: docker compose -f e2e/compose.yml logs

      - name: Push Docker image (only from develop and main)
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push
