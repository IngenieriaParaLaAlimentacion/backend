name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python-env

      - name: Run unit tests
        run: poetry run pytest tests/unit --cov --cov-report=xml --durations=25
        env:
          COVERAGE_CORE: sysmon

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 #v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        run: poetry run pytest tests/integration --cov --cov-report=xml --durations=25
        env:
          COVERAGE_CORE: sysmon

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 #v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config p/python --config p/secrets --error

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # TEMP: the third ref is only to create the package; remove it before the PR.
      PUBLISH: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/publish-backend-image' }}
    services:
      # Same credentials as DATABASE_* in e2e/.env.e2e.
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 1

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container shares the runner's network to reach the PostgreSQL service.
      - name: Prepare the database
        run: >-
          docker run --rm --network host
          --env-file e2e/.env.e2e -e DATABASE_HOST=localhost
          ${{ env.IMAGE }}:sha-${{ github.sha }}
          sh -c "alembic upgrade head && python seed_superadmin.py && python seed_food_catalog.py"

      - name: Start the backend
        run: >-
          docker run -d --name backend --network host
          --env-file e2e/.env.e2e -e DATABASE_HOST=localhost
          ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Wait for the backend to be ready
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/ready && exit 0
            sleep 2
          done
          echo "The backend did not become ready" >&2
          exit 1

      - name: Show the backend logs
        if: failure()
        run: docker logs backend

      - name: Push Docker image (only from develop and main)
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push
