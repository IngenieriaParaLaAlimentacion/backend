x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:

  migrate:
    build: *backend-build
    command: ["sh", "scripts/pre_deploy.sh"]
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build

    ports:
      - "8080:${PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres   # ← sobreescribe el .env dentro del contenedor
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
    networks:
      - backend-net

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8080}/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:17.9-bookworm
    container_name: postgres

    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: redis

    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend-net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  redis-data:

networks:
  backend-net:
    driver: bridge
