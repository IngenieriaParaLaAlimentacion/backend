services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:${PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres   # ← sobreescribe el .env dentro del contenedor
    networks:
      - backend-net

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.9-bookworm
    container_name: postgres

    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  backend-net:
    driver: bridge